name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: "yarn"

      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.ts') }}
          restore-keys: eslint-

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn concurrently --kill-others-on-fail "yarn type-check" "yarn lint" "yarn test"
